<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrepICFES - Simulacros Saber 11°</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <meta name="theme-color" content="#1a237e">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="logo" onclick="navigate('home')">
        <div class="logo-icon">📚</div>
        <span>PrepICFES</span>
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        <nav></nav>
        <button id="theme-toggle" onclick="toggleTheme()" style="background:transparent;border:none;color:rgba(255,255,255,0.8);font-size:18px;cursor:pointer;padding:8px;border-radius:8px;transition:all 0.3s" title="Cambiar tema">🌙</button>
      </div>
    </div>
  </header>

  <main id="main-content" class="container">
    <div class="loading">Cargando...</div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/data2.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/study.js"></script>
  <script src="js/simulacro.js"></script>
  <script src="js/stats.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
